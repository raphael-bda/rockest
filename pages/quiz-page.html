<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quizzes interativos sobre rock da ROCKEST. Teste seu conhecimento ou descubra qual instrumento combina com você.">
  <title>Quiz — ROCKEST</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="page-wrapper">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Início</a>
        <span class="sep">›</span>
        <span class="current">Quiz</span>
      </nav>

      <div id="quiz-selector" class="quiz-selector">
        <p class="section-subtitle">Interativo</p>
        <h1 class="section-title">QUIZZES ROCKEST</h1>
        <div class="title-rule mb-2"></div>
        <p style="text-align:center;color:var(--white-dim);font-size:0.9rem;font-weight:300;max-width:600px;margin:0 auto 2rem">
          Escolha um quiz abaixo para começar
        </p>
        <div class="quiz-grid" id="quiz-selector-grid">
          <!-- Renderizado via JS -->
        </div>
      </div>

      <div id="quiz-active" class="quiz-container" style="display:none">
        <!-- Quiz ativo renderizado aqui -->
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../js/cursos.js"></script>
  <script src="../js/quiz.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // ─── Estado do Quiz ───
    let currentQuiz = null;
    let currentQuestionIndex = 0;
    let answers = [];

    // ─── Renderizar seletor de quizzes ───
    function renderQuizSelector() {
      const grid = document.getElementById('quiz-selector-grid');
      const quizzes = [QUIZ_CONHECIMENTO, QUIZ_INSTRUMENTO];
      grid.innerHTML = quizzes.map(q => {
        const root = '../';
        return `
          <article class="quiz-card" style="cursor:pointer" data-quiz-id="${q.id}">
            <div class="quiz-card-icon">${q.emoji}</div>
            <h2 class="quiz-card-title">${q.titulo}</h2>
            <p class="quiz-card-desc">${q.descricao}</p>
            <button class="btn btn-primary start-quiz-btn" data-quiz-id="${q.id}">Começar Quiz →</button>
          </article>
        `;
      }).join('');

      // Event listeners
      document.querySelectorAll('.start-quiz-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.quizId;
          const quiz = id === QUIZ_CONHECIMENTO.id ? QUIZ_CONHECIMENTO : QUIZ_INSTRUMENTO;
          startQuiz(quiz);
        });
      });
    }

    // ─── Iniciar Quiz ───
    function startQuiz(quiz) {
      currentQuiz = quiz;
      currentQuestionIndex = 0;
      answers = [];

      document.getElementById('quiz-selector').style.display = 'none';
      const active = document.getElementById('quiz-active');
      active.style.display = 'block';
      active.innerHTML = '';
      renderQuestion();
    }

    // ─── Renderizar Pergunta ───
    function renderQuestion() {
      const active = document.getElementById('quiz-active');
      const q = currentQuiz.perguntas[currentQuestionIndex];
      const total = currentQuiz.perguntas.length;
      const progress = ((currentQuestionIndex) / total) * 100;

      active.innerHTML = `
        <div class="quiz-progress">
          <div class="quiz-progress-bar">
            <div class="quiz-progress-fill" style="width:${progress}%"></div>
          </div>
          <span class="quiz-progress-text">${currentQuestionIndex + 1}/${total}</span>
        </div>
        <div class="quiz-question">
          <p class="quiz-question-number">Questão ${currentQuestionIndex + 1} de ${total}</p>
          <p class="quiz-question-text">${q.pergunta}</p>
          <div class="quiz-options">
            ${q.opcoes.map((opt, idx) => `
              <div class="quiz-option" data-valor="${opt.valor}" data-idx="${idx}">
                <span class="radio-dot"></span>
                <span>${opt.texto}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="quiz-navigation">
          <button class="btn btn-outline" id="quiz-prev" ${currentQuestionIndex === 0 ? 'disabled style="opacity:0.3;cursor:not-allowed"' : ''}>← Anterior</button>
          <button class="btn btn-primary" id="quiz-next" disabled>Próxima →</button>
        </div>
      `;

      // Event listeners nas opções
      active.querySelectorAll('.quiz-option').forEach(opt => {
        opt.addEventListener('click', () => {
          // Remove selected de todas
          active.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          // Habilita botão next
          document.getElementById('quiz-next').disabled = false;
          // Salva resposta
          const valor = opt.dataset.valor;
          answers[currentQuestionIndex] = valor;
        });
      });

      // Se já tinha resposta salva, pré-seleciona
      if (answers[currentQuestionIndex] !== undefined) {
        const valor = answers[currentQuestionIndex];
        const opt = active.querySelector(`.quiz-option[data-valor="${valor}"]`);
        if (opt) {
          opt.classList.add('selected');
          document.getElementById('quiz-next').disabled = false;
        }
      }

      // Botão next
      document.getElementById('quiz-next').addEventListener('click', () => {
        if (currentQuestionIndex < total - 1) {
          currentQuestionIndex++;
          renderQuestion();
        } else {
          showResult();
        }
      });

      // Botão prev
      const prevBtn = document.getElementById('quiz-prev');
      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
          }
        });
      }
    }

    // ─── Mostrar Resultado ───
    function showResult() {
      const active = document.getElementById('quiz-active');
      
      let resultado;
      if (currentQuiz.id === 'quiz-conhecimento') {
        // Quiz de conhecimento: soma os valores
        const pontos = answers.reduce((sum, v) => sum + parseInt(v), 0);
        resultado = currentQuiz.calcularResultado(pontos);
      } else {
        // Quiz de instrumento: frequência
        resultado = currentQuiz.calcularResultado(answers);
      }

      // Encontrar link de curso se for quiz de instrumento
      let cursoCta = '';
      if (currentQuiz.id === 'quiz-instrumento' && resultado.cursoId) {
        const curso = getCursoById(resultado.cursoId);
        if (curso && !curso.disabled) {
          cursoCta = `<a href="${curso.link}" target="_blank" rel="noopener sponsored" class="btn btn-primary">${resultado.emoji} Quero Aprender ${resultado.instrumento}!</a>`;
        } else {
          cursoCta = `<a href="cursos.html" class="btn btn-primary">Ver Cursos Disponíveis →</a>`;
        }
      } else if (currentQuiz.id === 'quiz-conhecimento') {
        cursoCta = `<a href="cursos.html" class="btn btn-primary">${resultado.cta}</a>`;
      }

      const compartilharTexto = encodeURIComponent(`🎸 Fiz o quiz "${currentQuiz.titulo}" no ROCKEST e meu resultado foi: ${resultado.titulo}!`);
      const compartilharUrl = encodeURIComponent(window.location.href);

      active.innerHTML = `
        <div class="quiz-progress">
          <div class="quiz-progress-bar">
            <div class="quiz-progress-fill" style="width:100%"></div>
          </div>
          <span class="quiz-progress-text">Finalizado!</span>
        </div>
        <div class="quiz-result">
          <div class="quiz-result-titulo">${resultado.titulo}</div>
          <p class="quiz-result-desc">${resultado.desc}</p>
          ${cursoCta ? `<div class="quiz-result-cta">${cursoCta}</div>` : ''}
          <div class="quiz-result-share">
            <a href="https://wa.me/?text=${compartilharTexto}" target="_blank" rel="noopener">WhatsApp</a>
            <a href="https://twitter.com/intent/tweet?text=${compartilharTexto}&url=${compartilharUrl}" target="_blank" rel="noopener">Twitter</a>
          </div>
          <button class="btn btn-outline" id="quiz-restart" style="margin-top:1rem">Responder Novamente</button>
        </div>
      `;

      document.getElementById('quiz-restart')?.addEventListener('click', () => {
        document.getElementById('quiz-selector').style.display = 'block';
        active.style.display = 'none';
        currentQuiz = null;
        currentQuestionIndex = 0;
        answers = [];
      });
    }

    // ─── Inicializar ───
    document.addEventListener('DOMContentLoaded', () => {
      renderQuizSelector();

      // Verificar se veio com parâmetro ?quiz=
      const params = new URLSearchParams(window.location.search);
      const quizId = params.get('quiz');
      if (quizId === QUIZ_CONHECIMENTO.id) {
        startQuiz(QUIZ_CONHECIMENTO);
      } else if (quizId === QUIZ_INSTRUMENTO.id) {
        startQuiz(QUIZ_INSTRUMENTO);
      }
    });
  </script>
</body>
</html>
